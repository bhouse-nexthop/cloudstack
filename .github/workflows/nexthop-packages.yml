# Builds Debian packages for this branch, including the non-redistributable
# plugins, and uploads them as workflow artifacts.
#
# The non-free plugins (VMware, NSX, Netris, Tungsten, Contrail, Veeam, SIOC,
# Cisco VNMC, mysql-ha) are gated behind -Dnoredist and need proprietary jars
# that are not on Maven Central. They are installed into the local repository
# first, from a pinned commit of shapeblue/cloudstack-nonoss.
#
# These packages are NOT redistributable. Keep them internal.

name: Build Debian packages

on:
  workflow_dispatch:
    inputs:
      brand:
        description: "Branding string used in the package version"
        required: false
        default: "nexthop"
  push:
    branches:
      - 'nexthop/**'
      - '4.22-nexthop'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-deb:
    name: Build .deb packages
    # noble, so build-deb.sh derives a ~noble suffix from lsb_release
    runs-on: ubuntu-24.04
    timeout-minutes: 180

    steps:
      - name: Check out
        uses: actions/checkout@v4
        with:
          # build-deb.sh reads the branch name and rewrites poms; it needs real history
          fetch-depth: 0

      - name: Reclaim runner disk
        run: |
          # a full CloudStack build plus the UI does not fit alongside the
          # preinstalled toolchains
          before=$(df -BG --output=avail / | tail -1 | tr -dc '0-9')
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /usr/local/share/boost "$AGENT_TOOLSDIRECTORY" || true
          after=$(df -BG --output=avail / | tail -1 | tr -dc '0-9')
          echo "Free disk: ${before}G -> ${after}G"

      - name: Install build dependencies
        run: |
          # dpkg-checkbuilddeps reads the apt database, so everything in debian/control's
          # Build-Depends has to be a real package. Toolchains put on PATH by setup-java or
          # setup-node do not satisfy it.
          curl -fsSL https://deb.nodesource.com/setup_22.x | sudo -E bash -
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential devscripts debhelper lsb-release genisoimage jq \
            maven nodejs \
            python3-mysql.connector python3-setuptools \
            libws-commons-util-java libcommons-codec-java libcommons-httpclient-java

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '11'

      - name: Confirm the build dependencies are actually satisfied
        run: |
          # fail here, in two seconds, rather than after a long build
          dpkg-checkbuilddeps
          echo "java:  $(java -version 2>&1 | head -1)"
          echo "maven: $(mvn -v | head -1)"
          echo "node:  $(node --version)"

      - name: Cache Maven repository
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          # the non-free jars are reinstalled below on every run, so they are
          # never served stale from this cache
          key: m2-noredist-${{ runner.os }}-${{ hashFiles('**/pom.xml') }}
          restore-keys: m2-noredist-${{ runner.os }}-

      - name: Install non-redistributable dependencies
        env:
          # pinned rather than tracking the default branch: these jars end up
          # inside packages we deploy
          NONOSS_SHA: f94b5cf
        run: |
          git clone --filter=blob:none --no-checkout \
            https://github.com/shapeblue/cloudstack-nonoss.git /tmp/nonoss
          git -C /tmp/nonoss checkout "$NONOSS_SHA"
          (cd /tmp/nonoss && bash install-non-oss.sh)
          rm -rf /tmp/nonoss

      - name: Build packages
        env:
          # the UI's webpack uses an MD4 hash that Node 17+ refuses by default
          NODE_OPTIONS: --openssl-legacy-provider
          ACS_BUILD_OPTS: -DskipTests -Dnoredist -Dnonoss -T 1C
        run: |
          cd packaging
          ./build-deb.sh \
            --brand "${{ inputs.brand || 'nexthop' }}" \
            --use-timestamp \
            --output-directory "${GITHUB_WORKSPACE}/dist"

      - name: Separate the packages we deploy from the rest
        run: |
          # dpkg-buildpackage builds everything debian/control declares. Only the packages that
          # actually go on a host are archived; docs, marvin and the integration tests are build
          # by-products we never install.
          mkdir -p dist/deploy
          for p in common management agent usage ui; do
            mv dist/cloudstack-${p}_*.deb dist/deploy/
          done

          {
            echo "### Archived"
            echo
            echo "| Package | Size |"
            echo "|---|---|"
            for f in dist/deploy/*.deb; do
              echo "| \`$(basename "$f")\` | $(du -h "$f" | cut -f1) |"
            done
            echo
            echo "### Built but not archived"
            echo
            for f in dist/*.deb; do
              [ -f "$f" ] && echo "- \`$(basename "$f")\`"
            done
          } >> "$GITHUB_STEP_SUMMARY"

          echo "Archiving:"; ls -1 dist/deploy/
          echo "Discarding:"; ls -1 dist/*.deb 2>/dev/null || true

      - name: Check the non-free plugins actually made it in
        run: |
          # -Dnoredist quietly having no effect is the failure mode worth catching: the packages
          # build and install fine and the features are simply absent. The plugin classes are
          # shaded into the client jar rather than shipped as separate jars, so look inside it.
          mkdir -p /tmp/mgmt && dpkg-deb -x dist/deploy/cloudstack-management_*.deb /tmp/mgmt
          jar=$(find /tmp/mgmt -name 'cloudstack-*.jar' | head -1)
          echo "Inspecting $(basename "$jar")"

          missing=0
          for pkg in netris nsx vmware tungsten contrail veeam sioc; do
            n=$(unzip -l "$jar" | grep -ci "$pkg" || true)
            if [ "$n" -eq 0 ]; then
              echo "MISSING: no ${pkg} classes in the management jar"
              missing=1
            else
              echo "ok: ${pkg} (${n} entries)"
            fi
          done
          [ "$missing" -eq 0 ] || {
            echo "The non-redistributable plugins did not make it into the package."
            exit 1
          }

      - name: Upload packages
        uses: actions/upload-artifact@v4
        with:
          name: cloudstack-deb-${{ github.sha }}
          path: dist/deploy/*.deb
          retention-days: 30
          if-no-files-found: error
